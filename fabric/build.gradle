plugins { id 'net.fabricmc.fabric-loom' }

repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation project(':server')
    include project(':server')
    include implementation('local.meridian:server')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

// 命中僵直写入功法服务，功法模块是编译期必需依赖；功法库在 settings 中以源码组合，server 传递 shared 协议。
dependencies {
    implementation 'dev.kizuna.meridian.technique:fabric'
    implementation 'dev.kizuna.meridian.technique:server'
}

loom {
    mods {
        meridian_vanilla_damage { sourceSet sourceSets.main }
    }
    runs {
        server { runDir 'build/server' }
    }
}

// 事件注入点必须在真实游戏类上验证；测试宿主与样例身体不进入发布 JAR。
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // 与 1.20.1 一致由类路径上的纯 Java 库生效：GameTest 显式补 Humanoid 的 server，完整装配停用安装 JAR 里重复的嵌套副本。
    // Humanoid 在本仓之上，只在运行时需要，按装配清单读文件，避免低层构建反过来组合高层仓库。
    gametestRuntimeOnly files(kizunaWorkspace.artifact('humanoid-threatening', 'server', false))
    // 假玩家夹具来自功法库的 testFixtures，与功法 fabric 同经源码组合解析。
    gametestImplementation testFixtures('dev.kizuna.meridian.technique:fabric')
}

loom {
    mods {
        meridian_damage_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Damage GameTest'
            source sourceSets.gametest
            // 每次运行新建世界目录，避免旧存档影响回归且不删除先前验证证据。
            runDir providers.gradleProperty('gametestRunDir')
                    .getOrElse("build/gametest-${System.currentTimeMillis()}")
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

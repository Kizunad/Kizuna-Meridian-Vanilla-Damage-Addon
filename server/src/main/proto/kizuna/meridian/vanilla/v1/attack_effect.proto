syntax = "proto3";

package kizuna.meridian.vanilla.v1;

import "kizuna/meridian/v1/body.proto";
import "kizuna/meridian/v1/health.proto";

option java_package = "dev.kizuna.meridian.vanilla.protocol.pb";
option java_outer_classname = "AttackEffectMessages";

message AttackEffectContext {
  int32 protocol_version = 1;
  string attacker_subject_id = 2;
  kizuna.meridian.v1.BodySnapshot attacker_body = 3;
  string target_subject_id = 4;
  string source_id = 5;
  kizuna.meridian.v1.DamageKind kind = 6;
  double raw_damage_hp = 7;
  bool melee = 8;
  int64 server_tick = 9;
}

message AttackEffectPlan {
  bool handled = 1;
  double extra_damage_hp = 2;
  repeated StatusEffect status_effects = 3;
  string effect_id = 4;
}

message StatusEffect {
  string effect_id = 1;
  int32 duration_ticks = 2;
  int32 amplifier = 3;
}
